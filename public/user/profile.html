<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  <title>User Profile | UttamHub</title>
  
  <link rel="stylesheet" href="../header-nav.css">
  <link rel="stylesheet" href="profile/profile.css">
</head>

<body>
  <header class="main-header">
    <div class="header-container">
      <div class="brand">
        <h1 class="logo-text">UTTAMHUB</h1>
      </div>

      <div class="auth-section">
        <button id="login-btn" class="btn btn-primary">
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M21.35 11.1H12v2.7h5.38c-.23 1.28-.96 2.37-2.05 3.1v2.57h3.32c1.94-1.78 3.05-4.4 3.05-7.47c0-.61-.05-1.2-.15-1.7z" fill="#4285F4"/>
            <path fill="currentColor" d="M12 21c2.43 0 4.47-.8 5.96-2.2l-3.32-2.57c-.92.62-2.11 1-3.64 1c-2.8 0-5.17-1.89-6.02-4.43H1.61v2.65C3.1 18.39 7.24 21 12 21z" fill="#34A853"/>
            <path fill="currentColor" d="M5.98 12.8c-.22-.66-.35-1.36-.35-2.05s.13-1.39.35-2.05V6.05H1.61C.87 7.53.45 9.22.45 11s.42 3.47 1.16 4.95l4.37-3.15z" fill="#FBBC05"/>
            <path fill="currentColor" d="M12 5.3c1.66 0 3.15.57 4.32 1.69l3.23-3.23C17.58 1.84 15 1 12 1C7.24 1 3.1 3.61 1.61 6.05l4.37 3.15c.85-2.54 3.22-4.43 6.02-4.43z" fill="#EA4335"/>
          </svg>
          Log In
        </button>

        <div id="profile-card-container" class="profile-card-wrapper hidden">
          <div id="profile-card" class="profile-card" role="button" aria-haspopup="true">
            <img id="user-avatar" src="" alt="User Profile" class="avatar">
            <div class="user-greeting">
              <span class="greeting-label">Hello,</span>
              <span id="user-name" class="profile-name">User</span>
            </div>
          </div>

          <ul id="profile-dropdown" class="dropdown-menu hidden">
            <li><a href="user/profile.html" class="dropdown-item">1) Profile</a></li>
            <li><a href="user/account.html" class="dropdown-item">2) Account</a></li>
            <li><a href="user/orders.html" class="dropdown-item">3) Orders</a></li>
            <li><a href="user/inquiries.html" class="dropdown-item">4) Inquiries</a></li>
            <li class="dropdown-divider"></li>
            <li><button id="logout-btn" class="dropdown-item text-danger">Logout</button></li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <nav class="nav-strip">
    <div class="nav-container">
      <div class="nav-left-group">
        <button id="sidebar-toggle" class="nav-icon-btn" aria-label="Open Sidebar">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
      </div>

      <div class="nav-search-block">
        <div class="search-wrapper">
          <input type="text" placeholder="Search products, designs, services..." class="search-input">
          <button class="search-btn" aria-label="Submit Search">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
        </div>
      </div>

      <div class="nav-utility-group">
        <a href="#contact" class="nav-link">Contact Us</a>
        <a href="#cart" class="nav-icon-link" title="Cart">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2s-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96c0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12l.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48c0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2s2-.9 2-2s-.9-2-2-2z"/></svg>
        </a>
        <a href="#inquiry" class="nav-icon-link" title="Inquiries">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10s10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.10 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41c0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.25z"/></svg>
        </a>
      </div>
    </div>
  </nav>

  <div class="profile-shortcut-nav-container">
    <div class="profile-shortcut-nav-wrapper">
      <a href="#personal-info-section" class="shortcut-nav-btn active">Personal Info</a>
      <a href="#address-section" class="shortcut-nav-btn">Main Address</a>
      <a href="#shipping-address" class="shortcut-nav-btn">Shipping Address</a>
    </div>
  </div>

  <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>
  <aside id="sidebar-menu" class="sidebar-menu">
    <div class="sidebar-profile-box">
      <div class="sidebar-avatar-wrapper">
        <img id="sidebar-user-avatar" src="https://via.placeholder.com/80" alt="User Profile" class="sidebar-large-avatar">
      </div>
      <div class="sidebar-user-info">
        <span class="sidebar-greeting">Welcome,</span>
        <h3 id="sidebar-user-name" class="sidebar-profile-name">Guest User</h3>
      </div>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li><a href="#home" class="sidebar-link">Home</a></li>
        <li><a href="#products" class="sidebar-link">Products</a></li>
        <li><a href="#designs" class="sidebar-link">Custom Designs</a></li>
        <li><a href="#services" class="sidebar-link">Services</a></li>
        <li class="sidebar-divider"></li>
        <li><a href="#about" class="sidebar-link">About Us</a></li>
        <li><a href="#contact" class="sidebar-link">Contact Support</a></li>
      </ul>
    </nav>
  </aside>

 <main class="profile-container">
  
  <section id="hero-section" class="profile-section">
    <div class="profile-hero">
      <div class="profile-avatar-container">
        <img id="display-profile-photo" src="" alt="User Profile Photo" class="profile-main-photo">
      </div>
      <h2 id="display-profile-fullname" class="profile-hero-name">Loading...</h2>
    </div>
  </section>

  <section id="personal-info-section" class="profile-section">
  <div class="partition-header">
    <h3>Personal Information</h3>
    <button type="button" class="btn-edit" onclick="toggleEdit('personal-info-section')">Edit</button>
  </div>
  
  <form id="personal-form" class="edit-locked">
    <div class="form-group">
      <label>Name (First, Middle, Last)</label>
      <div class="form-row">
        <input type="text" id="input-first-name" disabled placeholder="First">
        <input type="text" id="input-middle-name" disabled placeholder="Middle">
        <input type="text" id="input-last-name" disabled placeholder="Last">
      </div>
    </div>
    
    <div class="form-row">
      <input type="date" id="input-dob" disabled title="Birthdate">
      <select id="select-gender" disabled>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
    </div>

    <input type="tel" id="input-mobile" disabled placeholder="Mobile Number">
    <input type="email" id="input-email" disabled placeholder="Email ID">
    
    <select id="select-education" disabled>
      <option value="">Select Education</option>
      <option value="10th Pass">10th Pass</option>
      <option value="12th Pass">12th Pass</option>
      <option value="Graduate">Graduate</option>
      <option value="Master">Master</option>
    </select>
  </form>
  </section>

<section id="address-section" class="profile-section">
  <div class="partition-header">
    <h3>Address</h3>
    <button type="button" class="btn-edit" onclick="toggleEdit('address-section')">Edit</button>
  </div>

  <form id="address-form" class="edit-locked">
    <div class="form-row">
      <input type="text" id="input-house" disabled placeholder="Flat/House No.">
      <input type="text" id="input-society" disabled placeholder="Society/Village">
    </div>
    
    <div class="form-group">
      <textarea id="input-address-line" disabled placeholder="Address Line (Additional Details)" rows="2"></textarea>
    </div>

    <div class="form-row">
      <input type="text" id="input-street" disabled placeholder="Street">
      <input type="text" id="input-landmark" disabled placeholder="Landmark">
    </div>

    <div class="form-row">
      <input type="text" id="input-area" disabled placeholder="Area">
      <input type="text" id="input-district" disabled placeholder="District">
    </div>

    <div class="form-row">
      <input type="text" id="input-state" disabled placeholder="State">
      <input type="text" id="input-country" disabled placeholder="Country">
      <input type="number" id="input-pincode" disabled placeholder="Pincode">
    </div>
  </form>
</section>

</main>

  <script type="module" src="../global.js"></script>
  <script src="profile/profile.js"></script>
</body>
</html>
